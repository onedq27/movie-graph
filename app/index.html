<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ფილმების გრაფი</title>
  <meta name="description" content="gemovie.tv-ის ფილმებისა და სერიალების მსგავსების გრაფი">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ფილმები">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="#/movie" aria-label="ფილმების გრაფი — მთავარი">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.6" opacity=".55">
          <line x1="16" y1="16" x2="6" y2="8"/><line x1="16" y1="16" x2="26" y2="9"/>
          <line x1="16" y1="16" x2="8" y2="26"/><line x1="16" y1="16" x2="25" y2="24"/>
          <line x1="26" y1="9" x2="25" y2="24"/>
        </g>
        <circle cx="6" cy="8" r="3" fill="var(--g0)"/><circle cx="26" cy="9" r="3" fill="var(--g2)"/>
        <circle cx="8" cy="26" r="3" fill="var(--g3)"/><circle cx="25" cy="24" r="3" fill="var(--g1)"/>
        <circle cx="16" cy="16" r="5" fill="var(--accent)"/>
      </svg>
      <span class="brand-name">ფილმების გრაფი</span>
    </a>

    <nav class="seg" aria-label="ნაკრები">
      <a href="#/movie" data-set="movie">ფილმები</a>
      <a href="#/serial" data-set="serial">სერიალები</a>
    </nav>

    <div class="search">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="12.8" y1="12.8" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="სახელი ან ID" aria-label="ძებნა სახელით ან ID-ით">
      <button id="q-clear" class="icon-btn" type="button" aria-label="ძებნის გასუფთავება" hidden>
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="genre-wrap">
      <button id="genre-btn" class="btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="genre-pop">
        <span>ჟანრი</span><span id="genre-badge" class="badge" hidden></span>
        <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="genre-pop" class="popover" hidden>
        <div class="popover-head">
          <span>აირჩიე ერთი ან რამდენიმე</span>
          <button id="genre-clear" class="link-btn" type="button">გასუფთავება</button>
        </div>
        <div id="genre-chips" class="chips"></div>
        <div class="popover-foot"><button id="genre-done" class="btn primary" type="button">მზადაა</button></div>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="view-status" class="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>იტვირთება…</p>
    </section>

    <section id="view-list" hidden>
      <div class="list-head">
        <h1 id="list-count"></h1>
        <p id="list-note" class="muted" hidden></p>
        <nav class="seg view-seg" aria-label="ხედი">
          <a href="#/movie" data-view="list">სექციები</a>
          <a href="#/movie/map" data-view="map">რუკა</a>
        </nav>
      </div>
      <div id="sections" class="sections" hidden></div>
      <ul id="results" class="results"></ul>
      <div id="list-empty" class="empty" hidden>
        <p class="empty-title">ვერაფერი მოიძებნა</p>
        <p class="muted">სცადე სხვა სახელი, ID ან ნაკლები ჟანრი.</p>
        <button id="list-reset" class="btn" type="button">ფილტრების გასუფთავება</button>
      </div>
      <div class="more-wrap"><button id="more" class="btn" type="button" hidden>მეტის ჩვენება</button></div>
    </section>

    <section id="view-map" hidden>
      <div class="stage map-stage">
        <div class="stage-bar">
          <nav class="seg view-seg" aria-label="ხედი">
            <a href="#/movie" data-view="list">სექციები</a>
            <a href="#/movie/map" data-view="map">რუკა</a>
          </nav>
          <button id="map-fit" class="btn icon" type="button" aria-label="რუკის ჩატევა ეკრანზე" title="ჩატევა ეკრანზე">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p id="map-note" class="map-note" aria-live="polite" hidden></p>
          <div id="map-legend" class="legend" aria-label="ფერები ჟანრის მიხედვით"></div>
        </div>
        <div id="map" class="graph map"></div>
        <div id="map-status" class="status map-status" hidden></div>
        <aside id="map-card" class="map-card" aria-label="არჩეული სათაური" aria-live="polite" hidden></aside>
      </div>
    </section>

    <section id="view-graph" hidden>
      <div class="stage">
        <div class="stage-bar">
          <a id="back" class="btn" href="#/movie" aria-label="სიაში დაბრუნება">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>სია</span>
          </a>
          <label class="slider">
            <span>მეზობლები</span>
            <input id="count" type="range" min="5" max="30" step="1" value="12">
            <output id="count-out" for="count">12</output>
          </label>
          <button id="fit" class="btn icon" type="button" aria-label="გრაფის ჩატევა ეკრანზე" title="ჩატევა ეკრანზე">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="legend" class="legend" aria-label="ფერები ჟანრის მიხედვით"></div>
        </div>
        <div id="graph" class="graph"></div>
        <p id="graph-note" class="graph-note" hidden></p>
      </div>
      <aside id="panel" class="panel" data-sheet="peek" aria-label="დეტალები">
        <button id="sheet-grip" class="sheet-grip" type="button" aria-label="დეტალების გაშლა ან ჩაკეცვა"><span></span></button>
        <div id="panel-body" class="panel-body"></div>
      </aside>
    </section>
  </main>

  <script src="vendor/d3.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
