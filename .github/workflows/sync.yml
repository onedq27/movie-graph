name: Sync new titles

# Once a day: look for titles that appeared on gemovie.tv since the last run,
# add them to the app data and redeploy. Does nothing when there is nothing new.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC, 07:17 in Tbilisi
  workflow_dispatch:

permissions:
  contents: write   # commit app/data, update the data-state release
  actions: write    # start the Pages deploy

concurrency:
  group: sync
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  STATE_TAG: data-state
  CACHE_FILE: emb-intfloat_multilingual-e5-large-instruct.npz

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Scraped pages and embeddings are too big for the repo; they live as
      # assets of the "data-state" release.
      - name: Restore scrape state
        run: |
          mkdir -p state data/raw data/cache
          gh release download "$STATE_TAG" --dir state --pattern pages.jsonl.gz --pattern sitemap_keys.json
          gunzip -c state/pages.jsonl.gz > data/raw/pages.jsonl
          cp state/sitemap_keys.json state/sitemap_keys.before.json

      - name: Fetch new pages
        id: scrape
        run: |
          python3 pipeline/scrape.py --rate 3 --workers 4
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          before = set(json.load(open("state/sitemap_keys.before.json")))
          after = set(json.load(open("data/raw/sitemap_keys.json")))
          stored = set()
          for line in open("data/raw/pages.jsonl", encoding="utf-8"):
              try:
                  rec = json.loads(line)
              except ValueError:
                  continue
              if rec.get("status") == "ok":
                  stored.add(rec["key"])
          known = set()
          for line in __import__("gzip").open("state/pages.jsonl.gz", "rt", encoding="utf-8"):
              try:
                  rec = json.loads(line)
              except ValueError:
                  continue
              if rec.get("status") == "ok":
                  known.add(rec["key"])
          added, removed = len(stored - known), len((before - after) & known)
          print(f"added={added}")
          print(f"removed={removed}")
          print(f"changed={'true' if added or removed else 'false'}")
          PY

      - name: Summary
        run: echo "New titles ${{ steps.scrape.outputs.added }}, removed ${{ steps.scrape.outputs.removed }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.scrape.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.scrape.outputs.changed == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the embedding model
        if: steps.scrape.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-large-instruct

      - name: Restore embeddings
        if: steps.scrape.outputs.changed == 'true'
        run: |
          gh release download "$STATE_TAG" --dir data/cache --pattern "$CACHE_FILE"

      - name: Rebuild app data
        if: steps.scrape.outputs.changed == 'true'
        run: |
          python -m pytest -q
          python -m pipeline.run --if-changed

      - name: Save scrape state
        if: steps.scrape.outputs.changed == 'true'
        run: |
          gzip -c data/raw/pages.jsonl > state/pages.jsonl.gz
          cp data/raw/sitemap_keys.json state/sitemap_keys.json
          gh release upload "$STATE_TAG" state/pages.jsonl.gz state/sitemap_keys.json "data/cache/$CACHE_FILE" --clobber

      - name: Commit and deploy
        if: steps.scrape.outputs.changed == 'true'
        run: |
          if [ -z "$(git status --porcelain app/data)" ]; then
            echo "app data unchanged; nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          git commit -m "Sync: ${{ steps.scrape.outputs.added }} new, ${{ steps.scrape.outputs.removed }} removed"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with the workflow token does not start other workflows, so start the deploy here.
          gh workflow run pages.yml --ref main
