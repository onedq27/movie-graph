name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test the app
        run: node --test app/js/tests/*.mjs
      # Puts the commit into every css/js URL, so a page never mixes files of two deploys.
      - name: Stamp the build
        run: node app/dev/stamp.mjs app "${GITHUB_SHA::10}"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload app/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
